<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complex Gaming — Minecraft Server Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080d;
    --bg-soft:#0d0e14;
    --surface:#14151d;
    --surface-2:#1a1c26;
    --border:#262835;
    --border-soft:#1e2029;
    --fg:#f2f2f6;
    --fg-dim:#a6a7b3;
    --fg-mute:#6b6c79;
    --vanilla:#2fd9a8;
    --vanilla-deep:#0e2a24;
    --pixelmon:#ff9d2e;
    --pixelmon-deep:#3a2308;
    --cobblemon:#cf5ce0;
    --cobblemon-deep:#301230;
    --discord:#5865f2;
    --danger:#ef4747;
    --success:#33d17a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,.display{font-family:'Bungee',system-ui,sans-serif; letter-spacing:0.5px;}
  h3{font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--vanilla);color:#00110c;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-mute);}

  #app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 24px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:10px;border:none;
    font-weight:700;font-size:14px;letter-spacing:0.3px;
    transition:transform .15s ease, filter .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-sm{padding:9px 16px;font-size:13px;border-radius:8px;}
  .btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--border);}
  .btn-discord{background:var(--discord);color:#fff;}
  .btn-discord:hover{filter:brightness(1.1);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--fg-dim);}
  .btn-outline:hover{border-color:var(--fg-mute);color:var(--fg);}
  .btn-block{width:100%;}
  .btn-disabled{opacity:0.4;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;}

  .icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:currentColor;}

  /* ---------- Header ---------- */
  header.site-header{
    position:sticky;top:0;z-index:40;
    background:rgba(8,8,13,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .header-row{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:16px;}
  .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;line-height:1;}
  .header-right{display:flex;align-items:center;gap:16px;margin-left:auto;}
  .logo-img{height:34px;width:auto;display:block;}
  .logo small{font-family:'Inter';font-size:10px;font-weight:700;letter-spacing:3px;margin-top:4px;text-transform:uppercase;}
  .nav-cluster{display:flex;gap:8px;align-items:center;}
  .nav-btn{
    padding:9px 16px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;font-weight:700;font-size:13px;color:var(--fg-dim);
    transition:all .15s ease;
  }
  .nav-btn:hover{color:var(--fg);border-color:var(--fg-mute);}
  .nav-btn.active{background:var(--accent,var(--vanilla));color:#05130f;border-color:transparent;}
  .nav-btn.dd-trigger{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit;}
  .nav-btn.dd-trigger svg{width:10px;height:10px;}
  .nav-dropdown-wrap{position:relative;display:inline-flex;}
  .nav-dropdown{position:absolute;top:100%;left:0;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:190px;z-index:60;padding:8px;box-shadow:0 16px 32px rgba(0,0,0,0.55);}
  .nav-dropdown .dd-label{font-size:10px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:1px;padding:8px 10px 4px;}
  .nav-dropdown a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--fg-dim);letter-spacing:0.3px;text-transform:uppercase;}
  .nav-dropdown a:hover{background:var(--surface-2);color:#fff;}
  .nav-dropdown img{width:20px;height:20px;border-radius:5px;object-fit:cover;}
  .hamburger{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--fg);}

  .sub-header{border-bottom:1px solid var(--border-soft);background:var(--bg-soft);position:relative;}
  .store-dropdown{position:absolute;top:100%;left:24px;margin-top:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:210px;z-index:60;padding:8px;box-shadow:0 16px 32px rgba(0,0,0,0.55);}
  .store-dropdown .dd-label{font-size:10px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:1px;padding:8px 10px 4px;}
  .store-dropdown a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--fg-dim);letter-spacing:0.3px;text-transform:uppercase;}
  .store-dropdown a:hover{background:var(--surface-2);color:#fff;}
  .store-dropdown img{width:20px;height:20px;border-radius:5px;object-fit:cover;}
  .sub-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 24px;gap:12px;}
  .sub-row > *{min-width:0;}
  .sub-row > *:first-child{justify-self:start;}
  .sub-row > *:last-child{justify-self:end;}
  .sub-row > *:nth-child(2){justify-self:center;text-align:center;}
  .server-pill{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:0.5px;color:var(--fg-dim);}
  .ip-chip{background:var(--surface);border:1px solid var(--border);padding:7px 14px;border-radius:8px;font-size:12px;display:flex;gap:10px;align-items:center;}
  .ip-chip b{color:var(--accent);}
  .ip-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);}

  @media (max-width:820px){
    .nav-cluster.desktop-only{display:none;}
    .hamburger{display:inline-flex;}
  }
  @media (max-width:560px){
    .sub-row{grid-template-columns:1fr;justify-items:center;text-align:center;gap:10px;}
    .sub-row > *:first-child{justify-self:center;}
    .sub-row > *:last-child{justify-self:center;}
  }
  .mobile-menu{border-top:1px solid var(--border-soft);padding:12px 24px 20px;display:flex;flex-direction:column;gap:8px;}

  /* ---------- Footer ---------- */
  footer.site-footer{border-top:1px solid var(--border-soft);background:var(--bg-soft);margin-top:auto;padding:56px 0 28px;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;}
  @media (max-width:720px){.footer-grid{grid-template-columns:1fr;gap:32px;}}
  .footer-grid h4{margin:0 0 14px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--fg-dim);}
  .footer-links{display:flex;flex-wrap:wrap;gap:8px;}
  .footer-links a{background:var(--surface-2);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;}
  .footer-links a:hover{border-color:var(--fg-mute);}
  .social-row{display:flex;gap:10px;margin-top:16px;}
  .social-btn{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .social-btn:hover{border-color:var(--fg-mute);}
  .footer-bottom{margin-top:44px;padding-top:22px;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--fg-mute);font-size:12.5px;}

  /* ---------- Home / hero ---------- */
  .hero{padding:56px 0 34px;text-align:center;}
  .hero-logo-img{display:block;margin:0 auto;width:min(560px,80vw);height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,0.55));}
  .hero .online-line{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--fg-dim);font-size:14px;font-weight:600;margin-top:10px;}
  .hero .online-line .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);display:inline-block;}
  .count-flash{animation:countFlash .6s ease;}
  @keyframes countFlash{0%{opacity:1;}35%{opacity:.35;}100%{opacity:1;}}
  .hero p{color:var(--fg-dim);font-size:15px;max-width:520px;margin:16px auto 0;}
  .live-count{display:inline-flex;align-items:center;gap:8px;margin-top:22px;background:var(--surface);border:1px solid var(--border);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-dim);}

  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:24px 0 80px;}
  @media (max-width:900px){.card-grid{grid-template-columns:1fr;}}

  .server-card{
    position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--border);
    background:linear-gradient(180deg, var(--card-tint) 0%, var(--bg-soft) 65%);
    min-height:680px;display:flex;flex-direction:column;
    transition:transform .25s ease, border-color .25s ease;
  }
  .server-card:hover{transform:translateY(-4px);border-color:var(--card-accent);}
  .server-card .side-text{position:absolute;top:0;bottom:0;width:30px;overflow:hidden;user-select:none;pointer-events:none;}
  .server-card .side-text.left{left:2px;} .server-card .side-text.right{right:2px;}
  .server-card .side-text span{position:absolute;top:0;left:0;right:0;display:block;font-weight:800;font-size:10.5px;letter-spacing:2px;line-height:1.7;color:var(--card-accent);opacity:0.4;text-align:center;writing-mode:vertical-rl;text-orientation:upright;animation:scrollUp 16s linear infinite;}
  @keyframes scrollUp{from{transform:translateY(0);}to{transform:translateY(-50%);}}
  .server-card-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 34px 30px;}
  .server-card-body h3{font-size:44px;font-weight:800;margin:0 0 14px;color:#fff;}
  .server-card-body .ip{color:var(--card-accent);font-weight:700;font-size:15px;letter-spacing:0.5px;margin-bottom:8px;}
  .server-card-body .ip-sub{color:var(--fg-dim);font-size:13px;margin-bottom:34px;display:flex;align-items:center;gap:6px;}
  .server-card-body .ip-sub svg{width:12px;height:12px;opacity:0.8;}
  .server-card-body .online{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px;margin-bottom:34px;}
  .server-card-body .online svg{width:17px;height:17px;color:var(--card-accent);}
  .server-card-actions{position:relative;z-index:2;padding:0 28px 28px;display:flex;flex-direction:column;gap:10px;}
  .server-card-actions .row{display:flex;gap:10px;}
  .server-card-actions .row .btn{flex:1;padding:15px 22px;font-size:15px;}

  /* ---------- Section shared ---------- */
  .section{padding:56px 0;}
  .section-head{text-align:center;max-width:560px;margin:0 auto 34px;}
  .eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  .section-head h2{font-size:clamp(26px,4vw,38px);margin:0 0 10px;color:#fff;}
  .section-head p{color:var(--fg-dim);font-size:15px;line-height:1.6;}

  /* ---------- Server home ---------- */
  .server-hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:56px 0;}
  @media (max-width:820px){.server-hero{grid-template-columns:1fr;}}
  .art-panel{aspect-ratio:16/10;border-radius:16px;border:1px solid var(--border);background:
     radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 60%),
     linear-gradient(160deg, var(--surface), var(--bg-soft));
     display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .art-panel .icon-lg{width:88px;height:88px;color:var(--accent);opacity:0.85;}
  .server-hero h2{font-size:clamp(26px,4vw,36px);color:#fff;margin:0 0 14px;}
  .server-hero p{color:var(--fg-dim);line-height:1.7;margin-bottom:24px;}

  .miss-out{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:44px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;margin-bottom:56px;}
  @media (max-width:820px){.miss-out{grid-template-columns:1fr;}}
  .mode-chip{display:inline-block;background:var(--surface-2);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;margin:4px 6px 0 0;color:var(--fg);text-decoration:none;cursor:pointer;transition:all .15s ease;}
  a.mode-chip:hover{border-color:var(--accent,var(--fg-mute));color:#fff;background:var(--surface);}
  .mode-orb{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 55%, white 5%), color-mix(in srgb, var(--accent) 20%, black 40%));display:flex;align-items:center;justify-content:center;max-width:200px;margin:0 auto;box-shadow:0 0 60px color-mix(in srgb, var(--accent) 30%, transparent);}

  /* ---------- Forums ---------- */
  .forums-hero{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px;display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:center;margin:32px 0;}
  @media (max-width:820px){.forums-hero{grid-template-columns:1fr;}}
  .forums-hero img{width:100%;border-radius:14px;display:block;object-fit:cover;}
  .forums-hero h2{font-size:clamp(22px,3.4vw,30px);color:#fff;margin:0 0 12px;}
  .forums-hero p{color:var(--fg-dim);line-height:1.7;margin-bottom:20px;font-size:14px;}
  .news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;}
  @media (max-width:820px){.news-grid{grid-template-columns:1fr;}}
  .news-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .news-thumb{height:86px;width:100%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.9;}
  .news-thumb .icon-lg{width:34px;height:34px;}
  .news-card-body{padding:12px 14px;}
  .news-card h5{margin:0 0 6px;font-size:13px;color:#fff;font-weight:700;}
  .news-card p{margin:0 0 10px;font-size:12px;color:var(--fg-dim);line-height:1.5;}
  .news-meta{font-size:11px;color:var(--fg-mute);display:flex;align-items:center;gap:6px;}
  .staff-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px;display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:center;margin:32px 0;}
  @media (max-width:820px){.staff-panel{grid-template-columns:1fr;}}
  .staff-panel img{width:100%;border-radius:14px;display:block;object-fit:cover;}
  .staff-panel h2{font-size:clamp(22px,3.4vw,30px);color:#fff;margin:0 0 12px;}
  .staff-panel p{color:var(--fg-dim);line-height:1.7;margin-bottom:20px;font-size:14px;}

  /* ---------- Apply / Staff Application ---------- */
  .apply-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px;display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:center;margin:60px 0;}
  @media (max-width:640px){.apply-panel{grid-template-columns:1fr;}}
  .apply-panel img{width:100%;border-radius:14px;display:block;object-fit:cover;}
  .apply-panel h2{font-size:clamp(24px,3.6vw,34px);color:#fff;margin:0 0 12px;}
  .apply-panel p{color:var(--fg-dim);line-height:1.7;margin-bottom:22px;font-size:14px;}

  /* ---------- Stepper / play wizard ---------- */
  .wizard-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px;margin:40px 0;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:28px;}
  .step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg-mute);}
  .step-dot.active{background:var(--accent);color:#0a0a0a;border-color:transparent;}
  .step-dot.done{background:color-mix(in srgb, var(--accent) 25%, var(--surface-2));color:var(--accent);}
  .step-line{width:34px;height:2px;background:var(--border);}
  .wizard-body{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;}
  @media (max-width:720px){.wizard-body{grid-template-columns:1fr;}}
  .wizard-shot{aspect-ratio:16/10;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg-mute);font-size:13px;overflow:hidden;}
  .wizard-shot img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;}
  .wizard-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;}

  /* ---------- FAQ ---------- */
  .faq-item{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .faq-q{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-weight:700;font-size:14.5px;}
  .faq-a{padding:0 18px;max-height:0;overflow:hidden;transition:max-height .25s ease, padding .25s ease;color:var(--fg-dim);font-size:14px;line-height:1.6;}
  .faq-a.open{padding:0 18px 18px;max-height:300px;}

  /* ---------- Vote ---------- */
  .vote-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;padding:40px 0 70px;align-items:start;}
  @media (max-width:820px){.vote-layout{grid-template-columns:1fr;}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;}
  .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .avatar{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
  .reward-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;color:var(--fg-dim);}
  .reward-item:last-child{border-bottom:none;}
  .vote-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px;}
  @media (max-width:600px){.vote-grid{grid-template-columns:repeat(2,1fr);}}
  .vote-btn{background:var(--accent);color:#08110d;font-weight:800;border:none;border-radius:10px;padding:16px;font-size:14px;transition:transform .15s;}
  .vote-btn:hover{transform:translateY(-2px);}
  .vote-btn:disabled{opacity:0.45;cursor:default;transform:none;}

  /* ---------- Auth forms ---------- */
  .auth-wrap{max-width:420px;margin:70px auto;padding:0 24px 60px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:34px;}
  .auth-card h2{font-size:22px;color:#fff;margin:0 0 6px;text-align:center;}
  .auth-card .sub{text-align:center;color:var(--fg-mute);font-size:13px;margin-bottom:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--fg-dim);margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase;}
  .field input, .field select{
    width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--fg);
    padding:12px 14px;border-radius:9px;font-size:14px;outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .field .hint{font-size:11.5px;color:var(--fg-mute);margin-top:6px;}
  .field .err{font-size:11.5px;color:var(--danger);margin-top:6px;}
  .toggle-row{display:flex;gap:8px;margin-bottom:16px;}
  .toggle-opt{flex:1;text-align:center;padding:11px;border-radius:9px;border:1px solid var(--border);background:var(--bg-soft);font-weight:700;font-size:13px;color:var(--fg-dim);}
  .toggle-opt.active{background:var(--accent);color:#08110d;border-color:transparent;}

function makeVoters(){
  const names=['Ember','Rook','Juno','Vex','Talon','Nimbus','Sable','Wren','Kip','Zolt','Iris','Fable'];
  const colors=['#2fd9a8','#ff9d2e','#cf5ce0','#5865f2','#33d17a','#ef4747'];
  return Array.from({length:12}).map((_,i)=>({name:names[i%names.length]+Math.floor(Math.random()*90), color:colors[i%colors.length]}));
}

/* ============================= STORAGE ============================= */
async function loadPersisted(){
  try{
    const s = await window.storage.get('session');
    if(s && s.value){
      const sess = JSON.parse(s.value);
      const u = await window.storage.get('user:'+sess.email);
      if(u && u.value){ state.user = JSON.parse(u.value); }
    }
  }catch(e){ /* no session yet */ }
  try{
    const c = await window.storage.get('cart');
    if(c && c.value){ state.cart = JSON.parse(c.value); }
  }catch(e){ /* no cart yet */ }
  try{
    const ss = await window.storage.get('storeSession');
    if(ss && ss.value){ state.storeSession = JSON.parse(ss.value); }
  }catch(e){ /* no saved usernames yet */ }
  state.authLoading = false;
  render();
}
async function persistCart(){
  try{ await window.storage.set('cart', JSON.stringify(state.cart)); }catch(e){ console.error('cart save failed', e); }
}
async function persistStoreSession(){
  try{ await window.storage.set('storeSession', JSON.stringify(state.storeSession)); }catch(e){ console.error('store session save failed', e); }
}
async function persistUser(u){
  try{ await window.storage.set('user:'+u.email, JSON.stringify(u)); }catch(e){ console.error('user save failed', e); }
}
async function persistSession(email){
  try{ await window.storage.set('session', JSON.stringify({email})); }catch(e){ console.error('session save failed', e); }
}
async function clearSession(){
  try{ await window.storage.delete('session'); }catch(e){}
}

/* ============================= ROUTER ============================= */
function parseHash(){
  let h = location.hash.replace(/^#\/?/,'').replace(/\/$/,'');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {name:'home', params:{}};
  if(['vanilla','pixelmon','cobblemon'].includes(parts[0])){
    const server = parts[0];
    if(parts[1]==='vote') return {name:'vote', params:{server}};
    if(parts[1]==='play') return {name:'play', params:{server}};
    if(parts[1]==='forums') return {name:'forums', params:{server}};
    if(parts[1]==='apply') return {name:'apply', params:{server}};
    if(parts[1]==='support') return {name:'support', params:{server}};
    if(parts[1]==='store') return {name:'server-store', params:{server}};
    return {name:'server-home', params:{server}};
  }
  if(parts[0]==='store') return {name:'store-selector', params:{}};
  if(parts[0]==='giftcards') return {name:'giftcards', params:{}};
  if(parts[0]==='login') return {name:'login', params:{}};
  if(parts[0]==='register') return {name:'register', params:{}};
  return {name:'notfound', params:{}};
}
function navigate(hash){ location.hash = hash; }
window.addEventListener('hashchange', ()=>{ state.route = parseHash(); state.mobileMenuOpen=false; state.storeDropdownOpen=false; state.formsDropdownOpen=false; state.votesDropdownOpen=false; window.scrollTo(0,0); render(); });
document.addEventListener('click', (e)=>{
  if((state.formsDropdownOpen || state.votesDropdownOpen) && !e.target.closest('.nav-dropdown-wrap')){
    state.formsDropdownOpen = false;
    state.votesDropdownOpen = false;
    render();
  }
});

  vanilla:   { min: 700, max: 1000 },
  pixelmon:  { min: 80,  max: 200  },
  cobblemon: { min: 320, max: 500  }
};

function updatePlayerCount(serverId){
  const bounds = PLAYER_COUNT_BOUNDS[serverId];
  const s = SERVERS[serverId];
  if(!s || !bounds) return;

  const jitter = Math.floor(Math.random() * 10) + 1;       // 1-10
  const direction = Math.random() < 0.5 ? -1 : 1;           // add or remove
  let next = s.online + (jitter * direction);
  next = Math.max(bounds.min, Math.min(bounds.max, next));  // stay in realistic range
  next = Math.max(0, next);                                 // never negative

  s.online = next;

  // Direct, targeted DOM update (no full re-render) so navigating/scrolling isn't disrupted
  const el = document.getElementById(serverId + '-count');
  if(el){
    el.textContent = next.toLocaleString();
    el.classList.remove('count-flash');
    void el.offsetWidth; // restart the flash animation
    el.classList.add('count-flash');
  }

  const totalEl = document.getElementById('total-online-count');
  if(totalEl){
    const total = Object.values(SERVERS).reduce((sum, srv) => sum + srv.online, 0);
    totalEl.textContent = total.toLocaleString();
  }
}

function scheduleCountTick(serverId){
  const delay = 60000 + Math.random() * 60000; // randomized 60,000-120,000ms
  setTimeout(() => {
    updatePlayerCount(serverId);
    scheduleCountTick(serverId); // reschedule with a fresh random delay, independent of the others
  }, delay);
}

function startPlayerCountTickers(){
  Object.keys(PLAYER_COUNT_BOUNDS).forEach(scheduleCountTick);
}

window.handleLoginSubmit = async (e)=>{
  e.preventDefault();
  const email = e.target.email.value.trim();
  const password = e.target.password.value;
  state.loginError=''; state.loginPending=true; render();
  try{
    const rec = await window.storage.get('user:'+email);
    if(!rec || !rec.value){ state.loginError = 'No account found with that email.'; state.loginPending=false; render(); return; }
    const u = JSON.parse(rec.value);
    if(u.password !== password){ state.loginError = 'Incorrect password.'; state.loginPending=false; render(); return; }
    state.user = u;
    await persistSession(email);
    state.loginPending=false;
    toast('Welcome back, '+u.username+'!');
    navigate(state.redirectAfterLogin || '#/');
    state.redirectAfterLogin = null;
  }catch(err){
    state.loginError = 'Something went wrong. Try again.';
    state.loginPending=false; render();
  }
};

window.handleRegisterSubmit = async (e)=>{
  e.preventDefault();
  const email = e.target.email.value.trim();
  const username = e.target.username.value.trim();
  const password = e.target.password.value;
  const confirm = e.target.confirm.value;
  state.registerError=''; state.registerSuccess=false;
  if(username.length<3){ state.registerError='Username must be at least 3 characters.'; render(); return; }
  if(password.length<6){ state.registerError='Password must be at least 6 characters.'; render(); return; }
  if(password!==confirm){ state.registerError='Passwords do not match.'; render(); return; }
  state.registerPending=true; render();
  try{
    const existing = await window.storage.get('user:'+email).catch(()=>null);
    if(existing && existing.value){ state.registerError='An account with that email already exists.'; state.registerPending=false; render(); return; }
    const user = {email, username, password, createdAt: new Date().toISOString()};
    await persistUser(user);
    await persistSession(email);
    state.user = user;
    state.registerPending=false;
    state.registerSuccess=true;
    toast('Account created — welcome to Complex!');
    render();
    setTimeout(()=>{ navigate(state.redirectAfterLogin || '#/'); state.redirectAfterLogin=null; }, 600);
  }catch(err){
    state.registerError='Something went wrong creating your account.';
    state.registerPending=false; render();
  }
};

  else return 'STORE';
  if(key && state.storeSession[key]){
    const cats = STORE_CATEGORIES[key] || [];
    const tabId = currentTab[key] || (cats[0] && cats[0].id);
    const cat = cats.find(c=>c.id===tabId);
    if(cat){

        const subcats = VANILLA_SUBCATS[cat.id] || [];
        const subId = currentSubTab[cat.id] || (subcats[0] && subcats[0].id);
        const sub = subcats.find(s=>s.id===subId);
        return cat.label.toUpperCase()+(sub ? ' > '+sub.label.toUpperCase() : '');
      }
      return cat.label.toUpperCase();
    }
  }
  return defaultLabel;
}

/* ---------- PLAY WIZARD ---------- */
function renderPlay(id){
  const s = SERVERS[id];
  const steps = PLAY_STEPS[id];
  const idx = state.playStep[id] || 0;
  const step = steps[idx];
  const faqs = FAQS[id];
  return `
  ${renderHeader(id)}
  <main class="wrap" style="--accent:${s.colorHex}">
    <div class="wizard-card">
      <div class="stepper">
        ${steps.map((_,i)=>`
          ${i>0?'<div class="step-line"></div>':''}
          <div class="step-dot ${i===idx?'active':(i<idx?'done':'')}" style="${i===idx?`background:${s.colorHex};color:#08110d;`:(i<idx?`color:${s.colorHex};`:'')}" onclick="setPlayStep('${id}',${i})">${i<idx?'✓':i+1}</div>
        `).join('')}
      </div>
      <div class="wizard-body">
        <div class="wizard-shot">${step.img?`<img src="${step.img}" alt="Step ${idx+1}" />`:`Step ${idx+1} illustration`}</div>
        <div>
          <div class="badge" style="background:${s.colorHex}22;color:${s.colorHex};margin-bottom:10px;">Step ${idx+1}</div>
          <h3 style="color:#fff;margin:0 0 10px;font-size:22px;">${esc(step.title)}</h3>
          <p style="color:var(--fg-dim);line-height:1.7;">${esc(step.body)}</p>
          <a class="btn" href="${idx===0 && id==='vanilla' ? 'https://www.minecraft.net/download' : (idx===0 ? 'https://www.curseforge.com/download/app' : '#')}" target="${idx===0?'_blank':'_self'}" rel="noopener" style="background:${s.colorHex};color:#08110d;margin-top:6px;">${idx===0 && id==='vanilla' ? 'Download Minecraft' : (idx===0 ? 'CurseForge Website' : 'Continue')}</a>
        </div>
      </div>
      <div class="wizard-nav">
        <button class="btn btn-outline" ${idx===0?'disabled':''} onclick="setPlayStep('${id}',${idx-1})">← Back</button>
        <span style="color:var(--fg-mute);font-size:13px;">Step ${idx+1} of ${steps.length}</span>
        <button class="btn btn-outline" ${idx===steps.length-1?'disabled':''} onclick="setPlayStep('${id}',${idx+1})">Next →</button>
      </div>
    </div>

    <section style="padding-bottom:70px;">
      <h3 style="color:#fff;margin-bottom:16px;">FAQ</h3>
      ${faqs.map((f,i)=>{
        const key=id+'-'+i; const open = !!state.faqOpen[key];
        return `
        <div class="faq-item">
          <div class="faq-q" onclick="toggleFaq('${key}')">
            <span>${esc(f.q)}</span>
            <span style="transform:rotate(${open?180:0}deg);transition:transform .2s;">${ICONS.chevron}</span>
          </div>
          <div class="faq-a ${open?'open':''}">${esc(f.a)}</div>
        </div>`;
      }).join('')}
    </section>
  </main>
  ${renderFooter(id)}
  `;
}

/* ---------- STORE (shared for server + giftcards) ---------- */
function renderStoreGate(key, label, accent){
  const val = state.storeInput[key] || '';
  const core = val.startsWith('.') ? val.slice(1) : val;
  const len = core.length;
  const tooShort = len>0 && len<3, tooLong = len>16;
  const invalid = tooShort||tooLong;
  const avatarName = (len>=3 && !tooLong) ? core : 'Steve';
  return `
  <div class="store-gate" style="--accent:${accent}">
    <div class="card">
      <h2>You are logging into <b style="color:${accent}">${esc(label)}</b></h2>
      <div class="field" style="text-align:left;">
        <input id="store-username-${key}" placeholder="Enter your ingame username..." value="${esc(val)}" oninput="setStoreInputVal('${key}', this.value)" />
        <div class="char-count">
          <span style="color:${invalid?'var(--danger)':'var(--fg-mute)'};">${tooShort?'Too short':(tooLong?'Too long':'Must be 3-16 characters · Bedrock players: add a leading "."')}</span>
          <span class="mono">${len}/16</span>
        </div>
      </div>
      <div class="avatar-preview">
        <div class="avatar-preview-img"><img src="https://mc-heads.net/avatar/${encodeURIComponent(avatarName)}/48" alt="Minecraft head" width="40" height="40" /></div>
        <div class="avatar-preview-meta">
          <p>Selected Profile</p>
          <h3>${len>0 ? esc(val) : 'Player'}</h3>
        </div>
      </div>
      <button class="btn btn-block ${invalid||len===0?'btn-disabled':''}" style="background:${accent};color:#08110d;" ${invalid||len===0?'disabled':''} onclick="enterStore('${key}','${esc(label)}')">Continue to Store</button>
    </div>
  </div>`;
}

function renderRankCard(p, accent){
  const inCart = state.cart[p.id];
  const badgeColor = p.badge ? (BADGE_COLORS[p.badge]||accent) : null;
  const ring = RANK_TIERS[p.tier] || `linear-gradient(135deg, ${accent}88, ${accent}33)`;
  const addColor = '#ef4444';
  const avatarBlock = p.avatar
    ? `<div class="rank-avatar" style="background:none;width:104px;height:104px;"><img src="${p.avatar}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:contain;" /></div>`
    : `<div class="rank-avatar" style="background:${ring};"><div class="rank-avatar-inner" style="color:${accent};">${ICONS.crown}</div></div>`;
  let buyControl;
  if(p.link){
    buyControl = `<a href="${p.link}" target="_blank" rel="noopener" class="add-btn" style="background:${addColor};display:inline-block;text-decoration:none;text-align:center;">Add to Cart</a>`;
  } else if(inCart){
    buyControl = `
      <div class="rank-qty-row">
        <button onclick='decCart("${p.id}")'>−</button>
        <span>${inCart.qty}</span>
        <button onclick='incCart("${p.id}")'>+</button>
      </div>`;
  } else {
    buyControl = `<button class="add-btn" style="background:${addColor};" onclick='addToCart(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Add to Cart</button>`;
  }
  return `
  <div class="rank-card">
    ${p.badge ? `<span class="corner-badge" style="background:${badgeColor};">${esc(p.badge)}</span>` : ''}
    ${avatarBlock}
    <h4>${esc(p.name)}</h4>
    <div class="price">${money(p.price)}</div>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    ${p.features && p.features.length ? `<ul class="feature-list">${p.features.map(f=>`<li>${ICONS.check}${esc(f)}</li>`).join('')}</ul>` : ''}
    <div class="rank-actions">
      ${buyControl}
      <span class="view-details" onclick="toast('${esc(p.name)} details coming soon')">View Details</span>
    </div>
  </div>`;
}

function renderProductGrid(products, accent, iconKey){
  if(!products || products.length===0) return `<div class="center-note">No products in this category yet.</div>`;
  return `<div class="product-grid">
    ${products.map(p=>{
      const inCart = state.cart[p.id];
      return `
      <div class="product-card">
        ${p.popular?`<span class="pop">Popular</span>`:''}
        <div class="product-thumb" style="background:${accent}22;color:${accent};">${ICONS[iconKey]}</div>
        <h4>${esc(p.name)}</h4>
        <div class="price">${money(p.price)}</div>
        <p>${esc(p.desc)}</p>
        ${p.features && p.features.length ? `<ul class="feature-list">${p.features.map(f=>`<li>${ICONS.check}${esc(f)}</li>`).join('')}</ul>` : ''}
        ${inCart ? `
          <div class="qty-row">
            <button onclick='decCart("${p.id}")'>−</button>
            <span>${inCart.qty}</span>
            <button onclick='incCart("${p.id}")'>+</button>
            <button class="btn btn-outline btn-sm" style="margin-left:auto;" onclick='removeCart("${p.id}")'>Remove</button>
          </div>
        ` : `<button class="btn btn-block" style="background:${accent};color:#08110d;" onclick='addToCart(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Add to Cart</button>`}
      </div>`;
    }).join('')}
  </div>`;
}

  const cats = STORE_CATEGORIES[key] || STORE_CATEGORIES.vanilla;
  const tab = currentTab[key] || cats[0].id;
  const activeCat = cats.find(c=>c.id===tab) || cats[0];

  const isVanilla = key==='vanilla';
  const subcats = isVanilla ? (VANILLA_SUBCATS[activeCat.id] || []) : [];
  const subTab = isVanilla ? (currentSubTab[activeCat.id] || (subcats[0] && subcats[0].id)) : null;
  const activeSub = isVanilla ? (subcats.find(s=>s.id===subTab) || subcats[0]) : null;

  const catalog = key==='giftcards' ? GIFTCARD_PRODUCTS : storeCatalog(key);
  const products = isVanilla
    ? ((activeSub && (catalog[activeCat.id]||{})[activeSub.id]) || [])
    : (catalog[activeCat.id] || []);

    topContent = `

      <div class="icon-wrap">⚙</div>
      <div>

  } else {

    <div class="welcome-panel">
      <p><b>Welcome To The <span style="color:${accent}">Complex</span>-Gaming ${esc(activeCat.singular || activeCat.label)} Store!</b></p>
      <p>Here you will find all available digital in-game ${esc(activeCat.label.toLowerCase())}. Remember to read the TOS before purchasing any item on this page.</p>
      <p class="fine">Manage your subscription here: <a href="${TEBEX_URL}" target="_blank" rel="noopener" style="color:${accent};">${TEBEX_URL}</a></p>
      <p class="fine">Please note: you will need enough open inventory slots to receive all items from the below packages.</p>
    </div>`;
  }

  return `
  <div style="--accent:${accent};padding-top:32px;">
    ${cats.length>1 ? `
    <div class="tab-strip">
      ${cats.map(c=>`<button class="tab-strip-item ${c.id===tab?'active':''}" onclick="setStoreTab('${key}','${c.id}')">${esc(c.label)}</button>`).join('')}
    </div>` : ''}
    ${isVanilla && subcats.length>1 ? `
    <div class="tab-strip" style="margin-top:10px;">
      ${subcats.map(s=>`<button class="tab-strip-item ${s.id===subTab?'active':''}" onclick="setVanillaSubTab('${activeCat.id}','${s.id}')">${esc(s.label)}</button>`).join('')}
    </div>` : ''}
    ${topContent}
    ${key==='giftcards'
      ? `<div class="giftcard-grid">${products.map(p=>renderGiftcardCard(p)).join('')}</div>`
      : (cardType==='rank'
        ? `<div class="rank-grid">${products.map(p=>renderRankCard(p, accent)).join('')}</div>`
        : renderProductGrid(products, accent, gridIcon))}
  </div>
  ${renderCartDrawer(accent)}`;
}

function renderServerStore(id){
  const s = SERVERS[id];
  const key = id;
  const body = state.storeSession[key]
    ? renderStoreShop(key, s.name, s.colorHex)
    : renderStoreGate(key, s.name, s.colorHex);
  return `${renderHeader(id)}<main class="wrap" style="--accent:${s.colorHex}">${body}</main>${renderFooter(id)}`;
}

function renderGiftcards(){
  const accent = '#f5c542';
  const body = state.storeSession['giftcards']
    ? renderStoreShop('giftcards','Giftcards', accent)
    : renderStoreGate('giftcards','Giftcards', accent);
  return `${renderHeader(null)}<main class="wrap" style="--accent:${accent}">${body}</main>${renderFooter()}`;
}

function renderVanillaModeModal(){
  if(!state.vanillaModalOpen) return '';
  const modes = [
    {key:'skyblock', label:'Skyblock', img:MODE_SKYBLOCK_URI},
    {key:'factions', label:'Factions', img:MODE_FACTIONS_URI},
    {key:'survival', label:'Survival', img:MODE_SURVIVAL_URI},
    {key:'prison', label:'Prison', img:MODE_PRISON_URI},
    {key:'creative', label:'Creative', img:MODE_CREATIVE_URI},
    {key:'plus', label:'Plus+', img:MODE_PLUS_URI},
  ];
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeVanillaModal()">
    <div class="modal-card">
      <div class="modal-head">
        <h3>VANILLA</h3>
        <button class="modal-close" onclick="closeVanillaModal()">${ICONS.close}</button>
      </div>
      <div class="mode-grid">
        ${modes.map(m=>`
          <div class="mode-item" onclick="selectVanillaMode('${m.key}')">
            <img src="${m.img}" alt="${esc(m.label)}" style="width:40px;height:40px;object-fit:contain;" />
            <span>${esc(m.label)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

function renderStoreSelector(){
  const items = [
    {id:'pixelmon', name:'Pixelmon', img:ICON_PIXELMON_URI, href:'#/pixelmon/store'},
    {id:'cobblemon', name:'Cobblemon', img:ICON_COBBLEMON_URI, href:'#/cobblemon/store'},
    {id:'vanilla', name:'Vanilla', img:ICON_VANILLA_URI, href:'javascript:void(0)', onclick:'openVanillaModal()'},
    {id:'giftcards', name:'Giftcards', img:ICON_GIFTCARDS_URI, href:'#/giftcards'},
  ];
  return `
  ${renderHeader(null)}
  <main class="wrap">
    <section class="section">
      <div class="select-store-panel">
        <div class="section-head">
          <h2 style="font-size:26px;">Select Your Store</h2>
          <p>Select the server you wish to purchase something on from the options below! Giftcards are usable on Vanilla using /gc OR in the store!</p>
        </div>
        <div class="store-selector-grid">
          ${items.map(i=>`
            <a href="${i.href}" ${i.onclick?`onclick="${i.onclick}"`:''} class="store-select-card">
              <div class="store-select-icon"><img src="${i.img}" alt="${esc(i.name)}" /></div>
              <div>
                <div style="font-weight:700;font-size:15px;">${esc(i.name)}</div>
                <div style="color:var(--fg-mute);font-size:12.5px;">Select store</div>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    </section>
  </main>
  ${renderFooter()}
  ${renderVanillaModeModal()}
  `;
}

/* ---------- AUTH ---------- */
function renderLogin(){
  return `
  ${renderHeader(null)}
  <main class="auth-wrap">
    <div class="auth-card">
      <h2>Log In</h2>
      <div class="sub">Welcome back to Complex Gaming</div>
      ${state.loginError ? `<div class="form-error">${esc(state.loginError)}</div>` : ''}
      <form onsubmit="handleLoginSubmit(event)">
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com" /></div>
        <div class="field"><label>Password</label><input type="password" name="password" required placeholder="••••••••" /></div>
        <button class="btn btn-block ${state.loginPending?'btn-disabled':''}" style="background:var(--vanilla);color:#08110d;" ${state.loginPending?'disabled':''}>${state.loginPending?'Logging in…':'Log In'}</button>
      </form>
      <div class="auth-switch">Don't have an account? <a href="#/register">Register</a></div>
    </div>
  </main>
  ${renderFooter()}
  `;
}

function renderRegister(){
  return `
  ${renderHeader(null)}
  <main class="auth-wrap">
    <div class="auth-card">
      <h2>Register</h2>
      <div class="sub">Create your Complex Gaming account</div>
      ${state.registerError ? `<div class="form-error">${esc(state.registerError)}</div>` : ''}
      ${state.registerSuccess ? `<div class="form-success">Account created! Redirecting…</div>` : ''}
      <form onsubmit="handleRegisterSubmit(event)">
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com" /></div>
        <div class="field"><label>Username</label><input type="text" name="username" required placeholder="3-16 characters" minlength="3" maxlength="16" /></div>
        <div class="field"><label>Password</label><input type="password" name="password" required placeholder="At least 6 characters" minlength="6" /></div>
        <div class="field"><label>Confirm Password</label><input type="password" name="confirm" required placeholder="Repeat password" /></div>
        <button class="btn btn-block ${state.registerPending?'btn-disabled':''}" style="background:var(--vanilla);color:#08110d;" ${state.registerPending?'disabled':''}>${state.registerPending?'Creating…':'Create Account'}</button>
      </form>
      <div class="auth-switch">Already have an account? <a href="#/login">Log In</a></div>
    </div>
  </main>
  ${renderFooter()}
  `;
}

function renderNotFound(){
  return `
  ${renderHeader(null)}
  <main class="wrap">
    <div class="center-note" style="padding:120px 20px;">
      <h2 class="display" style="color:#fff;font-size:40px;">404</h2>
      <p style="margin:10px 0 24px;">This page doesn't exist in the Complex network.</p>
      <a href="#/" class="btn" style="background:var(--vanilla);color:#08110d;">Back to Home</a>
    </div>
  </main>
  ${renderFooter()}
  `;
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const r = state.route;
  let html = '';
  if(state.authLoading){
    html = `<main class="wrap"><div class="center-note" style="padding:160px 20px;">Loading…</div></main>`;
  } else {
    switch(r.name){
      case 'home': html = renderHome(); break;
      case 'server-home': html = renderServerHome(r.params.server); break;
      case 'play': html = renderPlay(r.params.server); break;
      case 'forums': html = renderForums(r.params.server); break;
      case 'apply': html = renderApply(r.params.server); break;
      case 'support': html = renderSupport(r.params.server); break;
      case 'vote': html = renderVote(r.params.server); break;
      case 'server-store': html = renderServerStore(r.params.server); break;
      case 'store-selector': html = renderStoreSelector(); break;
      case 'giftcards': html = renderGiftcards(); break;
      case 'login': html = renderLogin(); break;
      case 'register': html = renderRegister(); break;
      default: html = renderNotFound();
    }
  }
  document.getElementById('app').innerHTML = html;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart!=null && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){ /* ignore */ }
      }
    }
  }
}

/* ============================= INIT ============================= */
state.route = parseHash();
loadPersisted();
startPlayerCountTickers();
</script>
